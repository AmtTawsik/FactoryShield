[project]
name = "factoryshield"
version = "0.1.0"
description = "Safety and compliance management for garment factories in Bangladesh"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.163.1",
    "mcp>=2.3.0",
    "openai>=3.52.0",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.16.3",
    "pydantic[email]>=2.14.3",
    "pyjwt>=2.15.1",
    "pypdf>=7.1.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
