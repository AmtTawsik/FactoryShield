services:
  - type: web
    name: factoryshield-api
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: sh scripts/start.sh
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      # postgresql+asyncpg://user:password@host/dbname?ssl=require
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: "60"
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      # https://<space-host>/v1
      - key: EMBEDDING_BASE_URL
        sync: false
      # Hugging Face read token
      - key: EMBEDDING_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        value: intfloat/multilingual-e5-small
      - key: CORS_ORIGINS
        sync: false
