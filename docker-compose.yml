name: factoryshield

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: factoryshield-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "${POSTGRES_PORT:-5440}:5432"
    volumes:
      - factoryshield_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4
    container_name: factoryshield-embeddings
    command: ["--model-id", "${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}"]
    ports:
      - "${EMBEDDING_PORT:-8091}:80"
    volumes:
      - factoryshield_embedding_models:/data

volumes:
  factoryshield_postgres_data:
    name: factoryshield_postgres_data
  factoryshield_embedding_models:
    name: factoryshield_embedding_models
